# ---------------------------------------------------------------
# TestKart framework settings
# Any value here can be overridden from the command line, e.g.
#   mvn test -Dbrowser=firefox -DbaseUrl=http://localhost:8080
# ---------------------------------------------------------------

# Application under test
baseUrl=http://localhost:8080

# Browser: chrome | firefox | edge
browser=chrome

# Run mode: local (browser on this machine) | grid (Selenium Grid, e.g. Docker)
runMode=local
gridUrl=http://localhost:4444

# Run the browser without a window (useful for CI)
headless=false

# Explicit wait timeout in seconds
timeout=10

# Seeded test users (from the TestKart demo data, not real accounts)
standardUser.email=standard@testkart.com
standardUser.password=Test@1234
lockedUser.email=locked@testkart.com
lockedUser.password=Test@1234

# Test data and output folders (relative to the project root)
testDataFile=testdata/TestKartData.xlsx
reportFolder=reports
screenshotFolder=reports/screenshots
